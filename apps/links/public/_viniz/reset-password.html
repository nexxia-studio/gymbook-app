<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Réinitialiser ton mot de passe — Viniz</title>
    <meta name="robots" content="noindex" />
    <!--
      GYM-303 — LE RELAIS DE RÉINITIALISATION, POUR TOUTES LES SALLES.

      🔴 CETTE PAGE EST FONCTIONNELLE : elle n'entre JAMAIS dans le filet 404 de GYM-287.
      Un membre qui a demandé un nouveau mot de passe doit pouvoir le définir, quelle que
      soit sa salle. Avant ce lot, seul /dopamine/reset-password existait : tous les autres
      membres tombaient sur un 404 nu de Vercel, définitivement bloqués hors de leur compte.

      DOUBLE RÔLE, identique à la page Dopamine dont elle est le pendant générique :
      1. CIBLE Universal Link (iPhone, app installée) : iOS intercepte l'URL AVANT le
         chargement grâce à l'AASA (composant /* de l'app Viniz) et ouvre l'écran natif.
         La page n'est alors PAS rendue.
      2. REPLI (Android / desktop / app absente) : la page se charge et relaie vers la page
         web du dashboard, en PRÉSERVANT query et fragment.

      ⚠️ LE FRAGMENT PORTE LES JETONS DE RECOVERY et n'est JAMAIS transmis par une
      redirection serveur (301/302) : le relais DOIT rester en JS côté client.

      ⚠️ ET C'EST ICI QUE NAÎT LE CONTEXTE DE SALLE. Le lien porte le slug dans son CHEMIN
      (links.viniz.app/<slug>/reset-password) — vérifié dans le dépôt, pas supposé :
      `apps/mobile/lib/gymUrls.ts` construit `${LINKS_BASE}/${slug}/reset-password`. On le
      relaie donc au dashboard en `?gym=<slug>`, ce qui rend la page d'arrivée tenant-aware
      sans qu'aucune Edge Function ne change.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center;
        justify-content: center; padding: 24px;
        background: #2D1B69; color: #F3F0FF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card { max-width: 420px; width: 100%; padding: 40px 28px; }
      /* GYM-303 — LE MOT-MARQUE, PLUS SON APPROXIMATION TYPOGRAPHIQUE.
         Cette page écrivait « ViNiZ » en Arial Black espacé : une imitation, pas la
         marque. Le logotype est servi par ce même site statique, sous `/brand/` — donc
         sans build, sans CDN, et sans dépendance à un autre domaine.

         ⚠️ LE RECADRAGE EST CELUI DU RESTE DU PRODUIT. L'art est posé au milieu d'une
         toile CARRÉE de 1500 : affiché tel quel, il flotterait dans le vide. Le tableau de
         bord le cadre depuis toujours dans une boîte 5:1 à `overflow:hidden`, image
         centrée (`AuthLayout`, `Sidebar`) — même technique ici, en CSS nu. Le ratio 5:1
         recoupe la mesure du rendu (encre 5,12, centrée à 1,5 px près) et les deux PNG
         exportés (5,00 et 5,09). */
      .logo {
        position: relative; width: 150px; height: 30px; overflow: hidden;
        margin: 0 auto 28px;
      }
      .logo img {
        position: absolute; left: 50%; top: 50%; width: 150px; max-width: none;
        transform: translate(-50%, -50%);
      }
      h1 { font-size: 22px; margin: 0 0 12px; color: #F3F0FF; }
      p { font-size: 15px; line-height: 1.6; color: #C8C2E6; margin: 0 0 24px; }
      .btn {
        display: inline-block; background: #C8FF3D; color: #2D1B69; font-weight: 700;
        text-decoration: none; padding: 14px 28px; border-radius: 12px; font-size: 15px;
      }
      .hint { margin-top: 20px; font-size: 12px; color: #C8C2E6; opacity: 0.75; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo"><img src="/brand/viniz-wordmark-lime.svg" alt="Viniz" /></div>
      <h1>Redirection…</h1>
      <p>On t'emmène définir ton nouveau mot de passe.</p>
      <a id="continue" class="btn" href="#">Continuer</a>
      <p class="hint">Si rien ne se passe, tape le bouton ci-dessus.</p>
    </main>

    <script>
      // Base web de la page reset du dashboard (GYM-157). Site STATIQUE pur : pas de build,
      // pas d'injection d'env → constante unique et documentée, alignée sur celle de la
      // page Dopamine dont cette page est le pendant.
      var WEB_RESET_BASE = 'https://app.viniz.app/reset-password'

      // Le slug est le PREMIER segment du chemin : /studio-kama/reset-password → studio-kama.
      // ⚠️ On ne devine rien : si le chemin n'a pas la forme attendue, on relaie SANS
      // contexte, et le dashboard rendra son habillage neutre. Un slug inventé serait pire
      // qu'un habillage neutre — il afficherait la marque d'une salle au membre d'une autre.
      var segments = window.location.pathname.split('/').filter(Boolean)
      var slug = segments.length >= 2 ? segments[0] : ''

      var search = window.location.search
      if (slug) {
        search += (search ? '&' : '?') + 'gym=' + encodeURIComponent(slug)
      }

      // Query ET fragment préservés : les jetons de recovery vivent dans le fragment.
      var dest = WEB_RESET_BASE + search + window.location.hash
      document.getElementById('continue').setAttribute('href', dest)
      window.location.replace(dest)
    </script>
  </body>
</html>
