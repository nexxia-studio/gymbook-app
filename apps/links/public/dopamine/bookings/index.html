<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mes réservations — Dopamine</title>
    <meta name="robots" content="noindex" />
    <!--
      GYM-238 — Page de repli /bookings. ELLE MANQUAIT, et c'est ce qui rendait le
      correctif des emails impossible sans elle.

      🔴 LE DÉFAUT D'ORIGINE. Tous les emails membres portaient un bouton
      `<a href="dopamine://bookings">`. Gmail, Apple Mail et Outlook n'ouvrent QUE
      http(s) : un schéma personnalisé y est INERTE — pas d'erreur, pas de message,
      rien. Antoine l'a constaté en production le 18/08 : « je clique dessus, rien ne
      se passe ». Les emails pointent désormais https://links.viniz.app/{slug}/bookings,
      d'où cette cible.

      ⚠️ ICI, dopamine:// RESTE LÉGITIME — et ce n'est pas une contradiction. Le défaut
      corrigé concerne les CLIENTS MAIL, qui refusent les schémas personnalisés. Une PAGE
      WEB, elle, peut parfaitement en déclencher un : c'est le mécanisme qu'emploient déjà
      les quatre pages voisines (confirm-waitlist, payment-success, reset-password,
      delete-account) et il fonctionne.

      DOUBLE RÔLE, comme ses voisines :
      1. CIBLE Universal Link : iOS intercepte l'URL avant le chargement (AASA + paths
         /dopamine/*) et ouvre l'app directement. La page n'est alors quasiment jamais rendue.
      2. REPLI : Android, desktop, ou app absente → la page s'affiche, tente le schéma
         personnalisé, et laisse un bouton pour le rejouer à la main.

      Aucune donnée sensible, aucun appel API : cette page ne fait que rediriger.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #111111;
        color: #F5F4F0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #1A1A1A;
        border: 1px solid #2A2A2A;
        border-radius: 20px;
        padding: 40px 28px;
      }
      .logo {
        font-family: "Arial Black", Arial, sans-serif;
        color: #C8FF3D;
        font-size: 24px;
        letter-spacing: 2px;
        margin-bottom: 28px;
      }
      h1 { font-size: 22px; margin: 0 0 12px; color: #F5F4F0; }
      p { font-size: 15px; line-height: 1.6; color: #9A9890; margin: 0 0 24px; }
      .btn {
        display: inline-block;
        background: #C8FF3D;      /* lime sur fond sombre = OK contraste */
        color: #17102E;           /* texte foncé sur lime */
        font-weight: 700;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 15px;
      }
      .hint { margin-top: 20px; font-size: 12px; color: #6B6861; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">DOPAMINE</div>
      <h1>Mes réservations</h1>
      <p>
        Ouvre l'app Dopamine, onglet Réservations, pour retrouver tes cours à venir.
      </p>
      <a id="open-app" class="btn" href="dopamine://bookings">Ouvrir l'app Dopamine</a>
      <p class="hint">Pas encore l'app ? Retrouve-la sur l'App Store.</p>
    </main>

    <script>
      // Tente d'ouvrir l'app au chargement. Si elle est installée, iOS bascule dessus ;
      // sinon la page reste affichée avec le bouton, qui rejoue la même tentative.
      window.location.href = 'dopamine://bookings'
    </script>
  </body>
</html>
