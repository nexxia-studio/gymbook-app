# verify_jwt explicite par fonction (évite une réécriture silencieuse au déploiement).
# Le projet cible est passé via --project-ref au déploiement (pas de project_id couplé ici).
#
# ═══════════════════════════════════════════════════════════════════════════════
# GYM-256 — TOUTES LES FONCTIONS SONT DÉCLARÉES ICI. C'EST LA RÈGLE.
# ═══════════════════════════════════════════════════════════════════════════════
# Une valeur non déclarée n'est pas « la valeur par défaut » : c'est une valeur que
# PERSONNE N'A CHOISIE et que personne ne relit. La protection d'un point d'entrée ne
# doit pas dépendre d'un défaut implicite de la plateforme, qui peut changer d'une
# version de CLI à l'autre sans que rien ne le signale.
#
# ⚠️ TOUTE NOUVELLE FONCTION SE DÉCLARE ICI, avec un commentaire nommant CE QUI LA
# PROTÈGE. Une fonction à `verify_jwt = false` sans garde nommée est un défaut, pas une
# configuration.
#
# ⚠️ `verify_jwt = true` NE VEUT PAS DIRE « réservé aux gérants ». La passerelle accepte
# TOUT JWT valide — y compris la CLÉ ANON, qui est publique (elle voyage dans le bundle
# mobile et dans eas.json). C'est un filtre anti-passant, pas une autorisation : le
# contrôle d'identité et de rôle se fait DANS la fonction (getUser + lecture du profil).
# Les commentaires ci-dessous nomment donc, pour chaque fonction, sa garde RÉELLE.

# Webhooks appelés par Mollie (auth = ?secret= dans l'URL, pas de JWT) → JWT désactivé.
[functions.mollie-webhook]
verify_jwt = false

[functions.mollie-subscription-webhook]
verify_jwt = false

# Fonctions appelées en interne par pg_cron / SQL (net.http_post avec
# X-Internal-Secret, sans JWT) → JWT désactivé sinon le gateway renvoie 401.
[functions.notify-waitlist]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false

[functions.send-noshow-notification]
verify_jwt = false

# Endpoints appelés par l'app authentifiée (JWT membre requis).
[functions.create-payment]
verify_jwt = true

[functions.create-subscription]
verify_jwt = true

# GYM-85 — appel gérant authentifié (JWT requis).
[functions.mollie-connect-oauth]
verify_jwt = true

# GYM-46 — suppression de compte in-app (JWT membre requis ; member_id = JWT, jamais body).
[functions.delete-account]
verify_jwt = true

# GYM-144 — création d'un membre au comptoir par le gérant (JWT gym_admin requis ;
# gym_id pris sur le profil de l'appelant, jamais du body).
[functions.admin-create-member]
verify_jwt = true

# GYM-143 — annulation d'un cours par le gérant (JWT gym_admin requis ;
# le slot doit appartenir à la salle de l'appelant, gym_id jamais pris du body).
[functions.cancel-slot]
verify_jwt = true

# GYM-112 — remboursement Mollie par le gérant (JWT gym_admin requis ;
# le paiement doit appartenir à la salle de l'appelant, jamais du body).
[functions.create-refund]
verify_jwt = true

# GYM-129 — édition identité membre par le gérant (JWT gym_admin requis ;
# la cible doit être un membre de la salle de l'appelant, jamais du body).
[functions.admin-update-member]
verify_jwt = true

# GYM-174 — pointage des présences par le gérant (JWT gym_admin requis ;
# la réservation / le membre doivent appartenir à la salle de l'appelant, gym_id jamais du body).
[functions.mark-attendance]
verify_jwt = true

# GYM-182 — ajustement manuel de crédits par le gérant (JWT gym_admin requis ;
# le membre doit appartenir à la salle de l'appelant, gym_id jamais du body).
[functions.adjust-credits]
verify_jwt = true

# GYM-222 — vente d'une formule à un membre existant, au comptoir (JWT gym_admin requis ;
# la cible doit être un membre de la salle de l'appelant, gym_id jamais du body ; le PRIX
# vient de gym_plans via resolve_plan_for_payment, jamais du client).
[functions.admin-sell-plan]
verify_jwt = true

# GYM-200 — invitation d'un membre d'équipe par le gérant (JWT gym_admin requis ;
# gym_id ET rôle scellés côté serveur : gym_id vient du profil de l'appelant, le rôle est
# validé contre une liste fermée — jamais pris du body tel quel).
[functions.invite-team-member]
verify_jwt = true

# GYM-200 — lecture et retrait des accès d'équipe (JWT gym_admin requis ; la cible doit
# appartenir à la salle de l'appelant, gym_id jamais du body).
[functions.team-access]
verify_jwt = true

# GYM-262 — Send Email Hook appelé par GoTrue (Supabase Auth), en serveur à serveur.
# GoTrue n'envoie AUCUN JWT : il signe le corps de la requête (Standard Webhooks, en-têtes
# webhook-id / webhook-timestamp / webhook-signature). Avec verify_jwt = true, la passerelle
# renverrait 401 avant même d'atteindre la fonction, et TOUS les emails d'auth tomberaient —
# donc toutes les inscriptions, le hook étant bloquant.
# ⚠️ L'authentification réelle de ce point d'entrée est la VÉRIFICATION DE SIGNATURE faite
# dans index.ts avec SEND_EMAIL_HOOK_SECRET, en tout premier, avant toute lecture de base.
[functions.auth-email-hook]
verify_jwt = false

# GYM-252 — balayage quotidien des impayés, appelé par pg_cron (net.http_post avec
# X-Internal-Secret, sans JWT) → JWT désactivé, comme send-reminders et
# send-noshow-notification. L'authentification réelle est la comparaison
# X-Internal-Secret faite en tête de la fonction.
[functions.process-failed-renewals]
verify_jwt = false

# ═══════════════════════════════════════════════════════════════════════════════
# GYM-256 — FONCTIONS JUSQU'ICI NON DÉCLARÉES
# ═══════════════════════════════════════════════════════════════════════════════
# Les onze entrées ci-dessous ne font QUE RENDRE EXPLICITE la posture déjà en place :
# `verify_jwt = true` est la valeur constatée sur la plateforme pour chacune (sondées en
# production le 26/08/2026 — la passerelle répond « Missing authorization header » sans
# en-tête, « Invalid JWT » avec un jeton mal formé). AUCUN comportement ne change.

# ── Endpoints MEMBRE (JWT du membre ; l'identité vient du jeton, jamais du body) ──
# Le membre agit pour lui-même : `getUser(token)` donne l'id, et toute la logique s'y
# rapporte. Aucun rôle à vérifier — c'est le sens même de ces appels.
[functions.create-booking]
verify_jwt = true

[functions.cancel-booking]
verify_jwt = true

[functions.confirm-waitlist]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

[functions.get-progression]
verify_jwt = true

# ── Endpoints GÉRANT (JWT + rôle vérifié DANS la fonction) ────────────────────────
# `verify_jwt` ne fait que rejeter les non-authentifiés ; c'est la lecture du profil
# (role ∈ gym_admin/super_admin, gym_id pris sur l'appelant et jamais du body) qui
# autorise réellement — même modèle que GYM-144, GYM-200, GYM-203.
[functions.admin-book-member]
verify_jwt = true

[functions.admin-lift-suspension]
verify_jwt = true

[functions.send-communication]
verify_jwt = true

[functions.slot-series-op]
verify_jwt = true

# ── Double entrée : gérant OU appel interne ──────────────────────────────────────
# generate-invoice accepte les deux : un JWT gym_admin depuis le dashboard, OU un
# X-Internal-Secret quand une autre fonction la déclenche (mollie-webhook,
# mollie-subscription-webhook, admin-create-member). Les deux gardes cohabitent dans la
# fonction ; `verify_jwt = true` n'empêche pas le second chemin, qui envoie lui aussi un
# jeton (service_role) dans l'en-tête Authorization.
[functions.generate-invoice]
verify_jwt = true

# ── 🔴 send-notification — LE TUYAU, DÉSORMAIS FERMÉ (GYM-282) ────────────────────
# `verify_jwt = true` RESTE, et ne suffit toujours pas : il vérifie qu'un JWT existe, pas
# que son porteur a le droit. La garde réelle est dans le CODE — un `X-Internal-Secret`
# comparé en temps constant, refusé en 401 avant toute lecture du corps.
#
# Ce qui était vrai jusqu'à ce lot, et ne l'est plus : « n'importe quel JWT valide, donc la
# clé anon qui est PUBLIQUE ». Vérifié le 26/08/2026, un appel avec la seule clé anon de
# staging rendait `{"ok":true,...}` — la fonction s'exécutait.
#
# ⚠️ `gym_id` EST DEVENU OBLIGATOIRE dans le corps. Il était optionnel, et l'omettre
# DÉSACTIVAIT la garde de plan de GYM-246 — la seule vérification que la fonction avait.
#
# Dix appelants, tous serveur-à-serveur depuis ce lot : send-reminders, notify-waitlist,
# mark-attendance, cancel-slot, slot-series-op, send-communication, admin-book-member,
# mollie-webhook, mollie-subscription-webhook, admin-lift-suspension. Le dashboard, qui
# était le SEUL appelant client, passe désormais par `admin-send-push`.
#
# ⚠️ ORDRE DE DÉPLOIEMENT — la garde ne s'active qu'APRÈS ses appelants, sans quoi les
# notifications tombent entre les deux déploiements. Checklist dans la PR.

# ── admin-send-push — LE GESTE GÉRANT, AVEC SON AUTORISATION (GYM-282) ───────────
# `verify_jwt = true` est ICI le bon réglage, et pas un pis-aller : le JWT du GÉRANT est
# ce qui l'identifie, et la fonction ajoute les trois vérifications qui manquaient — rôle
# gym_admin, appartenance du membre visé à SA salle, et résolution du jeton push CÔTÉ
# SERVEUR. Le dashboard n'envoie plus qu'un identifiant de membre, qui se vérifie.
[functions.admin-send-push]
verify_jwt = true

[functions.send-notification]
verify_jwt = true
